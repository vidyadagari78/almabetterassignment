# ==============================================================================
# AlmaBetter AI Evaluation Platform - Production NGINX Reverse Proxy
# Handles SSL termination, rate limiting, request buffering & CORS
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss;

    # Rate Limiting Zones (Leaky Bucket)
    # Zone 1: General API requests (30 requests/second with burst 50)
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=30r/s;
    # Zone 2: Evaluation triggers (Strict 5 requests/minute per client IP)
    limit_req_zone $binary_remote_addr zone=eval_trigger_limit:10m rate=5r/m;

    # Upstream API backend cluster
    upstream api_cluster {
        least_conn;
        server api:5000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name api.evaluations.almabetter.com;

        # Redirect plain HTTP to HTTPS in production
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name api.evaluations.almabetter.com;

        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/live/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/live/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;

        # Allow up to 100MB body for direct multipart ZIPs, larger offloaded to S3
        client_max_body_size 100M;
        client_body_buffer_size 128k;

        # 1. Submission Evaluation Trigger (Strict Rate Limiting)
        location ~ ^/api/v1/evaluations/submission/ {
            limit_req zone=eval_trigger_limit burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        # 2. Server-Sent Events (SSE) Stream for Live Pipeline Progress
        location ~ ^/api/v1/evaluations/.+/stream$ {
            proxy_pass http://api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 600s;
        }

        # 3. General API Routes
        location /api/ {
            limit_req zone=api_general_limit burst=50 nodelay;

            proxy_pass http://api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. Frontend Web Portal & Static Deliverables
        location / {
            proxy_pass http://api_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Liveness Healthcheck
        location = /api/v1/health {
            access_log off;
            proxy_pass http://api_cluster;
        }
    }
}
